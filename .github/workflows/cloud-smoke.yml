name: cloud-smoke

# Checks a public deployment: wake the instance, then liveness, readiness, the deployment contract, a
# real forecast, Prometheus metrics and the browser replay, with the latencies in the run summary.
# Runs every 6 hours against both live services, Render and Azure (a failing run notifies the
# repository owner), on demand against any URL, and from the azure workflow after each deployment.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL of the deployment (default: repository variable RENDER_URL)"
        required: false
  workflow_call:
    inputs:
      url:
        description: "Base URL of the deployment to check"
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/cloud-smoke.yml"
      - "render.yaml"
      - "Dockerfile.demo"

permissions:
  contents: read

jobs:
  check:
    # Targets: the url input alone when one is given (manual run, or the azure/aws workflows right after a
    # deployment); otherwise the three live services, Render (render.yaml), Azure Container Apps (azure.yml)
    # and AWS ECS Express Mode (aws.yml), overridable with the repository variables RENDER_URL, AZURE_URL
    # and AWS_URL. A wrong or dead URL fails the run.
    name: ${{ matrix.url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJSON(inputs.url && format('["{0}"]', inputs.url) || format('["{0}", "{1}", "{2}"]', vars.RENDER_URL || 'https://metronome-demo.onrender.com', vars.AZURE_URL || 'https://metronome-demo.politeground-6dc99748.koreacentral.azurecontainerapps.io', vars.AWS_URL || 'https://me-f271425dbfde4ebf8bb88ef9e5d409c7.ecs.ap-southeast-2.on.aws')) }}
    env:
      BASE: ${{ matrix.url }}
    steps:
      - name: wake the instance (Render sleeps after 15 idle minutes; Azure scales to zero)
        run: |
          echo "target: $BASE"
          for i in $(seq 1 30); do
            code=$(curl -s -m 30 -o health.txt -w "%{http_code}" "$BASE/health" || echo 000)
            echo "attempt $i: HTTP $code $(head -c 120 health.txt 2>/dev/null)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$BASE/health never returned 200 (last HTTP $code). Is this the service's URL?"; exit 1; }
      - name: readiness, deployment contract, forecast, metrics
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          base = os.environ["BASE"].rstrip("/")

          def get(path):
              t0 = time.perf_counter()
              with urllib.request.urlopen(base + path, timeout=30) as r:
                  body = r.read()
              return body, (time.perf_counter() - t0) * 1000

          rows = []
          body, ms = get("/ready"); ready = json.loads(body); rows.append(("/ready", ms, ready.get("model")))
          assert ready.get("ready") is True, ready
          body, ms = get("/v1/deployment"); dep = json.loads(body); rows.append(("/v1/deployment", ms, dep["dataset"]))
          hist = [[0.0] * len(dep["channels"])] * dep["lookback"]
          req = urllib.request.Request(base + "/v1/forecast", data=json.dumps({"history": hist}).encode(),
                                       headers={"content-type": "application/json"})
          lat = []
          for _ in range(5):
              t0 = time.perf_counter()
              with urllib.request.urlopen(req, timeout=30) as r:
                  out = json.loads(r.read())
              lat.append((time.perf_counter() - t0) * 1000)
              assert len(out["forecast"]) == dep["horizon"], out
          lat.sort()
          rows.append(("/v1/forecast (5 calls, median)", lat[2], out["model_version"]))
          body, ms = get("/metrics"); rows.append(("/metrics", ms, "prometheus"))
          assert b"metronome_forecast_requests_total" in body
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {base}\n\n| route | ms | note |\n|---|---:|---|\n")
              for route, ms, note in rows:
                  f.write(f"| {route} | {ms:.0f} | {note} |\n")
          print(json.dumps(rows))
          PY
      - name: browser replay page
        # The replay route ships with the demo image; on a pull request the live service may not have it yet.
        if: github.event_name != 'pull_request'
        run: curl -sf -m 60 "$BASE/replay" | grep -q "<title>Metronome Replay</title>"
      - name: workbench routes answer (data profile, leaderboard, candidates list)
        # The live service only carries merged code, so a pull request cannot be checked against it yet.
        if: github.event_name != 'pull_request'
        run: |
          curl -sf -m 60 "$BASE/v1/data/profile" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['n_rows']>0 and d['channel_stats'], d; print('profile', d['dataset'], d['n_rows'], 'rows')"
          curl -sf -m 60 "$BASE/v1/leaderboard" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['live'], d; print('leaderboard', len(d['offline']), 'offline rows,', len(d['live']), 'live versions')"
          curl -sf -m 60 "$BASE/v1/candidates" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'jobs' in d; print('candidates', len(d['jobs']), 'jobs')"

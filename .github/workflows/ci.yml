name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url $TORCH_INDEX && pip install -e ".[train,export,dev]"
      - run: ruff check src tests scripts dags
      - run: ruff format --check src tests scripts dags
      - name: mypy (strict modules listed in pyproject)
        run: mypy src/metronome/data src/metronome/drift src/metronome/cadence src/metronome/serving
      - name: dashboard JS parses
        run: node --check src/metronome/static/app.js

  test:
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - run: pip install torch --index-url $TORCH_INDEX && pip install -e ".[train,export,dev]"
      - run: pytest -q -p no:cacheprovider --junitxml=junit-${{ matrix.python-version }}.xml --cov=metronome --cov-report=term --cov-fail-under=70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: "junit-${{ matrix.python-version }}"
          path: "junit-*.xml"

  pipeline-smoke:
    # Real data, short budget: pinned ETTh1 -> validated Parquet -> 3-day refit cache -> policies ->
    # registry v0001 -> API -> replay -> retrain job -> worker -> v0002 verified and gated by the API.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install torch --index-url $TORCH_INDEX && pip install -e ".[train,export,dev]"
      - run: metronome prepare etth1
      - run: metronome cache etth1 --seed 0 --workers 2 --max-epochs 2 --limit-days 3
      - run: metronome simulate etth1_dlinear_s0 --out-dir artifacts/cadence-smoke
      - run: metronome deploy-init etth1 --registry registry/etth1 --threads 2 --max-epochs 2
      - name: serve, replay until a scheduled retrain, let the worker deliver v0002 through the gate
        run: |
          metronome serve --registry registry/etth1 --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/start -H 'content-type: application/json' -d '{"schedule_days": 2}'
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/step -H 'content-type: application/json' -d '{"steps": 96}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['retrain_requests'], d; print(d['position'])"
          metronome worker --registry registry/etth1 --api-url http://127.0.0.1:8000 --max-epochs 2 --once
          # the worker asks the API to promote v0002: integrity, then the gate on the same resolved
          # windows; either outcome is valid, the service must serve what the decision says
          curl -sf http://127.0.0.1:8000/v1/events | python3 -c "import sys,json,urllib.request; e=json.load(sys.stdin); d=[x for x in e['decisions'] if x['candidate']=='v0002']; assert d, e; d=d[-1]; assert d['decision'] in ('promote','reject','hold') and d['n_origins']>0 and d['via']=='worker', d; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready')); assert r['model']==('v0002' if d['applied'] else 'v0001'), (r, d); print('gate', d['decision'], d['reason'], 'candidate', d['candidate_mae'], 'champion', d['champion_mae'], 'on', d['n_origins'], 'origins; serving', r['model'])"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-smoke
          path: |
            registry/etth1
            artifacts/cadence-smoke
            serve.log
          if-no-files-found: error

  docker:
    needs: pipeline-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with: { name: registry-smoke, path: ci-input }
      - run: docker build -t metronome-serve -f Dockerfile .
      - name: run the ONNX-only image against the smoke registry, restart it, forecast both times
        run: |
          chmod -R a+rX ci-input/registry
          docker run -d --name api -p 8000:8000 -v "$PWD/ci-input/registry/etth1:/registry:ro" metronome-serve
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready > ready1.json || { echo "::error::api container never became ready"; docker logs api; exit 1; }
          cat ready1.json
          python3 - <<'EOF'
          import json, urllib.request
          dep = json.load(urllib.request.urlopen("http://127.0.0.1:8000/v1/deployment"))
          hist = [[0.0] * len(dep["channels"])] * dep["lookback"]
          req = urllib.request.Request("http://127.0.0.1:8000/v1/forecast", data=json.dumps({"history": hist}).encode(), headers={"content-type": "application/json"})
          out = json.load(urllib.request.urlopen(req))
          assert len(out["forecast"]) == dep["horizon"], out
          print("forecast ok", out["model_version"], out["latency_ms"])
          EOF
          docker restart api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready > ready2.json || { echo "::error::api container not ready after restart"; docker logs api; exit 1; }
          cat ready2.json
          python3 -c "import json; a=json.load(open('ready1.json')); b=json.load(open('ready2.json')); assert a['model']==b['model']=='v0002', (a,b)"
          docker image inspect metronome-serve --format 'image size {{.Size}} bytes'
      - name: the serving image must not contain torch
        run: docker run --rm metronome-serve python -c "import importlib.util,sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"

  compose:
    # The two-container deployment from the README, end to end: init trains v0001 into a named volume, the
    # ONNX-only API serves it, a replayed schedule makes the API write a retrain job, the PyTorch worker
    # container trains/exports/registers v0002 and asks the API to promote it (integrity, then the
    # performance gate; the API serves what the decision says). Needs a writable
    # registry for the API (ACTIVE pointer, jobs/) and one shared uid across both images.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      METRONOME_MAX_EPOCHS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: init (worker image) trains v0001 into the volume, then api + worker start
        run: |
          docker compose run --rm init
          docker compose up -d --build api worker
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready > ready1.json || { echo "::error::api never became ready"; docker compose logs --no-color; exit 1; }
          cat ready1.json
          python3 -c "import json; assert json.load(open('ready1.json'))['model'] == 'v0001'"
      - name: replay asks for a retrain, the worker container delivers v0002, the API decides
        run: |
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/start -H 'content-type: application/json' -d '{"schedule_days": 2}'
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/step -H 'content-type: application/json' -d '{"steps": 96}' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['retrain_requests'] and 'error' not in d['retrain_requests'][0], d; print(d['position'])"
          for i in $(seq 1 120); do
            n=$(curl -sf http://127.0.0.1:8000/v1/events | python3 -c "import sys,json; print(len([x for x in json.load(sys.stdin)['decisions'] if x['candidate']=='v0002']))" || echo 0)
            [ "$n" != "0" ] && break
            sleep 3
          done
          # the worker asked the API to promote v0002 (integrity, then the gate on the same resolved
          # windows); either outcome is valid, the service must serve what the decision says
          curl -sf http://127.0.0.1:8000/v1/events | python3 -c "import sys,json,urllib.request; e=json.load(sys.stdin); d=[x for x in e['decisions'] if x['candidate']=='v0002']; assert d, e; d=d[-1]; assert d['decision'] in ('promote','reject','hold') and d['n_origins']>0 and d['via']=='worker', d; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready')); assert r['model']==('v0002' if d['applied'] else 'v0001'), (r, d); print('gate', d['decision'], d['reason'], 'candidate', d['candidate_mae'], 'champion', d['champion_mae'], 'on', d['n_origins'], 'origins; serving', r['model'])"
      - name: container logs
        if: failure()
        run: docker compose logs --no-color
      - name: tear down
        if: always()
        run: docker compose down -v

  k8s:
    # The same two-process deployment on Kubernetes (deploy/k8s): a kind cluster in the job, the two
    # images built here and loaded into it, the init Job trains v0001 into the PVC, then the replay asks
    # for a retrain and the worker pod delivers v0002, which the API pod verifies and gates.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: build the serving and worker images
        run: |
          docker build -f Dockerfile -t metronome-serve:ci .
          docker build -f Dockerfile.worker -t metronome-worker:ci .
      - uses: helm/kind-action@v1
        with:
          cluster_name: metronome
      - name: load images and apply the manifests
        run: |
          kind load docker-image metronome-serve:ci metronome-worker:ci --name metronome
          kubectl apply -k deploy/k8s/overlays/ci
          kubectl -n metronome wait --for=condition=complete job/deploy-init --timeout=900s
          kubectl -n metronome rollout status deploy/api --timeout=300s
          kubectl -n metronome rollout status deploy/worker --timeout=300s
          kubectl -n metronome get pods -o wide
      - name: the API pod serves v0001
        run: |
          kubectl -n metronome port-forward svc/api 8000:8000 > /dev/null 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/ready > ready1.json
          cat ready1.json
          python3 -c "import json; assert json.load(open('ready1.json'))['model'] == 'v0001'"
      - name: replay asks for a retrain, the worker pod delivers v0002, the API pod decides
        run: |
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/start -H 'content-type: application/json' -d '{"schedule_days": 2}'
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/step -H 'content-type: application/json' -d '{"steps": 96}' | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['retrain_requests'] and 'error' not in d['retrain_requests'][0], d; print(d['position'])"
          for i in $(seq 1 120); do
            n=$(curl -sf http://127.0.0.1:8000/v1/events | python3 -c "import sys,json; print(len([x for x in json.load(sys.stdin)['decisions'] if x['candidate']=='v0002']))" || echo 0)
            [ "$n" != "0" ] && break
            sleep 3
          done
          # the worker asked the API to promote v0002 (integrity, then the gate on the same resolved
          # windows); either outcome is valid, the service must serve what the decision says
          curl -sf http://127.0.0.1:8000/v1/events | python3 -c "import sys,json,urllib.request; e=json.load(sys.stdin); d=[x for x in e['decisions'] if x['candidate']=='v0002']; assert d, e; d=d[-1]; assert d['decision'] in ('promote','reject','hold') and d['n_origins']>0 and d['via']=='worker', d; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready')); assert r['model']==('v0002' if d['applied'] else 'v0001'), (r, d); print('gate', d['decision'], d['reason'], 'candidate', d['candidate_mae'], 'champion', d['champion_mae'], 'on', d['n_origins'], 'origins; serving', r['model'])"
      - name: cluster state and pod logs
        if: failure()
        run: |
          kubectl -n metronome get all,pvc -o wide
          kubectl -n metronome describe pods | tail -n 80
          kubectl -n metronome logs job/deploy-init --tail=50 || true
          kubectl -n metronome logs deploy/api --all-containers --tail=100 || true
          kubectl -n metronome logs deploy/worker --all-containers --tail=100 || true

  airflow:
    # The weekly retrain-with-gate policy as an Airflow DAG (dags/metronome_retrain.py), run end to end
    # with `airflow dags test` against a live demo API: candidate trained and registered by the worker
    # code with activation off, the gate compares it with the champion, and only a better candidate is
    # promoted through the API. Both outcomes are valid; the job checks the decision was made and acted on.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      METRONOME_REGISTRY: ${{ github.workspace }}/registry/etth1
      METRONOME_API_URL: http://127.0.0.1:8000
      METRONOME_MAX_EPOCHS: "2"
      METRONOME_GATE_LOG: ${{ github.workspace }}/gate.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - name: install Airflow with its constraints, then metronome (training extras) on top
        # Airflow first: its constraint file pins old typing-extensions/pydantic/protobuf, and applying
        # it after metronome downgrades them under onnx and pydantic-core. The other order upgrades
        # only what metronome needs, and the import check below proves Airflow still loads.
        run: |
          pip install "apache-airflow==2.10.5" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"
          pip install torch --index-url $TORCH_INDEX
          pip install -e ".[train,export]"
          pip check || true
      - name: the DAG imports cleanly
        run: |
          airflow db migrate > /dev/null
          airflow dags list-import-errors
          [ "$(airflow dags list-import-errors -o json)" = "[]" ] || { echo "::error::DAG import errors"; exit 1; }
          airflow dags list | grep metronome_weekly_retrain
      - name: a live demo API (v0001) with a replayed stream
        run: |
          metronome prepare etth1
          metronome deploy-init etth1 --registry "$METRONOME_REGISTRY" --threads 2 --max-epochs 2
          nohup metronome serve --registry "$METRONOME_REGISTRY" --host 127.0.0.1 --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ready && break; sleep 1; done
          # no scheduled retrain inside the replay: the DAG decides when to retrain
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/start -H 'content-type: application/json' -d '{}'
          curl -sf -X POST http://127.0.0.1:8000/v1/replay/step -H 'content-type: application/json' -d '{"steps": 240}' > /dev/null
          curl -sf http://127.0.0.1:8000/v1/monitor | python3 -c "import sys,json; m=json.load(sys.stdin); print('champion', m['active_version'], 'rolling_7d_mae', m['rolling_7d_mae'], 'resolved', m['resolved_forecasts'])"
      - name: run the DAG end to end
        run: |
          airflow dags test metronome_weekly_retrain 2026-10-06
          cat gate.json
          python3 - <<'PY'
          import json, os, urllib.request
          d = json.load(open(os.environ["METRONOME_GATE_LOG"]))
          ready = json.load(urllib.request.urlopen("http://127.0.0.1:8000/ready"))
          expected = d["candidate"] if d["applied"] else d["champion"]
          assert ready["model"] == expected, (ready, d)
          assert d["decision"] in ("promote", "reject", "hold") and d["n_days"] >= 0, d
          mae = lambda v: "n/a" if v is None else f"{v:.4f}"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### airflow gate: {d['decision']} ({d['reason']})\n\n`{d['champion']}` {mae(d['champion_mae'])} vs candidate `{d['candidate']}` {mae(d['candidate_mae'])} on the same {d['n_origins']} origins ({d['n_days']} resolved days before {d['cutoff_time']}); serving `{ready['model']}`\n")
          PY
      - name: logs
        if: failure()
        run: |
          tail -n 50 serve.log || true
          find .airflow/logs -name "*.log" | head -20 | xargs -I{} sh -c 'echo "== {}"; tail -n 40 "{}"' || true

  tensorflow:
    # Keras DLinear vs PyTorch DLinear: identical outputs after weight transfer, and lockstep training
    # (same init, same batch order, same recipe) ending at the same epoch within 1% (protocol P15).
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch --index-url $TORCH_INDEX && pip install "tensorflow-cpu>=2.16,<3" && pip install -e ".[train,dev]"
      - run: python -c "import tensorflow as tf, torch; print('tensorflow', tf.__version__, 'torch', torch.__version__)"
      - run: pytest -q -p no:cacheprovider tests/test_tf.py
  demo-image:
    # The single-container image Render builds (render.yaml): trains v0001 at build time, serves the API,
    # dashboard, in-process worker and the bundled browser replay at /replay.
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t metronome-demo -f Dockerfile.demo .
      - name: run it like Render does and check the public routes
        run: |
          docker run -d --name demo -p 8000:8000 -e PORT=8000 metronome-demo
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -sf http://127.0.0.1:8000/ready > ready.json || { echo "::error::demo container never became ready"; docker logs demo; exit 1; }
          cat ready.json
          curl -sf -o /dev/null -w "%{http_code} %{size_download}B /\n" http://127.0.0.1:8000/
          curl -sf http://127.0.0.1:8000/replay -o replay.html
          grep -q "<title>Metronome Replay</title>" replay.html
          ls -l replay.html
      - name: workbench routes (data profile, CSV check, leaderboard, candidate training with the gate, model card, rollback)
        run: |
          B=http://127.0.0.1:8000
          curl -sf $B/v1/data/profile | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['dataset']=='etth1' and d['source']['sha256'] and d['validation']['ok'] and len(d['channel_stats'])==7, d.keys(); print('profile ok', d['split'])"
          printf 'timestamp,a,b\n2024-01-01 00:00:00,1,2\n2024-01-01 01:00:00,2,3\n2024-01-01 01:00:00,2,3\n2024-01-01 04:00:00,,5\n' > bad.csv
          curl -sf -F file=@bad.csv $B/v1/data/validate | python3 -c "import sys,json; d=json.load(sys.stdin); r=d['report']; assert d['ok'] is False and r['duplicates']==1 and r['gaps']==1 and r['nan_cells']==1, d; print('csv check ok', r['problems'])"
          curl -sf $B/v1/leaderboard | python3 -c "import sys,json; d=json.load(sys.stdin); assert [r['model'] for r in d['offline']][:1]==['patchtst'] and d['live'][0]['active'], d; print('leaderboard ok', len(d['offline']), 'families')"
          job=$(curl -sf -X POST $B/v1/candidates -H 'content-type: application/json' -d '{"model": "linear", "max_epochs": 2}' | python3 -c "import sys,json; print(json.load(sys.stdin)['job'])")
          for i in $(seq 1 120); do
            st=$(curl -sf $B/v1/candidates | python3 -c "import sys,json; j=[x for x in json.load(sys.stdin)['jobs'] if x['job']=='$job'][0]; print(j['status'], j.get('version') or '')")
            case "$st" in done*) break;; failed*) echo "::error::candidate failed: $st"; exit 1;; esac
            sleep 2
          done
          echo "candidate: $st"
          ver=$(echo "$st" | cut -d' ' -f2); [ -n "$ver" ]
          curl -sf $B/ready | python3 -c "import sys,json; assert json.load(sys.stdin)['model']=='v0001', 'a candidate must not activate itself'"
          curl -sf $B/v1/models/$ver/card | grep -q "모델 카드 — $ver"
          code=$(curl -s -o gate.json -w "%{http_code}" -X POST $B/v1/candidates/promote -H 'content-type: application/json' -d "{\"version\": \"$ver\"}")
          echo "gate -> $code: $(cat gate.json)"
          [ "$code" = "200" ] || [ "$code" = "409" ]
          if [ "$code" = "409" ]; then curl -sf -X POST $B/v1/candidates/promote -H 'content-type: application/json' -d "{\"version\": \"$ver\", \"force\": true}" > /dev/null; fi
          curl -sf $B/ready | python3 -c "import sys,json; assert json.load(sys.stdin)['model']=='$ver'"
          curl -sf -X POST $B/v1/models/rollback | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['rolled_back_to']=='v0001', d; print('rollback ok')"
          curl -sf $B/v1/replay/window | python3 -c "import sys,json; d=json.load(sys.stdin); assert len(d['history'])==336, len(d['history'])"
      - name: container logs
        if: failure()
        run: docker logs demo

  numbers:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: every number quoted in README/docs must match the artifact it cites
        run: python scripts/check_numbers.py --require-markers README.md docs/results.md docs/reproduction.md docs/serving.md docs/bigdata.md docs/model_search.md docs/evidence.md

name: aws-bootstrap

# One-time (idempotent) setup of the AWS side of the demo deployment, run by hand. It uses the
# account's access keys from the repository secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY and
# creates, in ap-northeast-2 (Seoul):
#   - the GitHub OIDC identity provider and a deploy role that only this repository's main branch
#     can assume (so the keys can be deleted afterwards and deployments become keyless),
#   - the ECS task execution role and the ECS infrastructure role Express Mode needs,
#   - the ECR repository (keeps the last 10 images), the ECS cluster and the CloudWatch log group.
# Re-running it changes nothing that already exists except the trust and inline policies, which it
# rewrites to the values below.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  REPO: ${{ github.repository }}
  CLUSTER: metronome
  ECR_REPO: metronome-demo
  LOG_GROUP: /ecs/metronome-demo
  DEPLOY_ROLE: metronome-github-deploy
  EXEC_ROLE: metronome-ecs-execution
  INFRA_ROLE: metronome-ecs-infrastructure

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: who am I (account id is masked in the public log)
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCOUNT"
          echo "ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"
          caller=$(aws sts get-caller-identity --query Arn --output text)
          case "$caller" in
            *":root") echo "::warning::These are root-user access keys. Create an IAM user (or use this workflow's deploy role) and delete the root keys." ;;
          esac
          echo "caller type: ${caller##*:}" | sed 's/[0-9]\{12\}/***/g'
      - name: GitHub OIDC provider (best effort; an organization policy may forbid it)
        run: |
          arn="arn:aws:iam::$ACCOUNT:oidc-provider/token.actions.githubusercontent.com"
          if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$arn" >/dev/null 2>&1; then
            echo "OIDC provider exists"; echo "OIDC=yes" >> "$GITHUB_ENV"
          elif out=$(aws iam create-open-id-connect-provider --url https://token.actions.githubusercontent.com \
                 --client-id-list sts.amazonaws.com --thumbprint-list 6938fd4d98bab03faadb97b34396831e3780aea1 2>&1); then
            echo "OIDC provider created"; echo "OIDC=yes" >> "$GITHUB_ENV"
          else
            echo "$out" | sed 's/[0-9]\{12\}/***/g'
            echo "::warning::Could not create the GitHub OIDC provider (usually an organization service control policy). Deployments will keep using the access keys; AWS_ROLE_ARN stays unset."
            echo "OIDC=no" >> "$GITHUB_ENV"
          fi
      - name: roles
        run: |
          ensure_role() {  # name, trust policy JSON
            if aws iam get-role --role-name "$1" >/dev/null 2>&1; then
              aws iam update-assume-role-policy --role-name "$1" --policy-document "$2"
              echo "role $1 exists (trust policy refreshed)"
            else
              aws iam create-role --role-name "$1" --assume-role-policy-document "$2" >/dev/null
              echo "role $1 created"
            fi
          }
          service_trust() {
            printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"%s"},"Action":"sts:AssumeRole"}]}' "$1"
          }
          aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com >/dev/null 2>&1 || true

          ensure_role "$EXEC_ROLE" "$(service_trust ecs-tasks.amazonaws.com)"
          aws iam attach-role-policy --role-name "$EXEC_ROLE" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

          ensure_role "$INFRA_ROLE" "$(service_trust ecs.amazonaws.com)"
          infra_policy=arn:aws:iam::aws:policy/service-role/AmazonECSInfrastructureRoleforExpressGatewayServices
          aws iam get-policy --policy-arn "$infra_policy" >/dev/null \
            || { echo "::error::managed policy $infra_policy not found in this partition"; exit 1; }
          aws iam attach-role-policy --role-name "$INFRA_ROLE" --policy-arn "$infra_policy"

          if [ "$OIDC" != "yes" ]; then
            echo "skipping the deploy role: no OIDC provider"
            exit 0
          fi
          trust=$(cat <<JSON
          {"Version":"2012-10-17","Statement":[{"Effect":"Allow",
            "Principal":{"Federated":"arn:aws:iam::$ACCOUNT:oidc-provider/token.actions.githubusercontent.com"},
            "Action":"sts:AssumeRoleWithWebIdentity",
            "Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com",
                                         "token.actions.githubusercontent.com:sub":"repo:$REPO:ref:refs/heads/main"}}}]}
          JSON
          )
          ensure_role "$DEPLOY_ROLE" "$trust"
          policy=$(cat <<JSON
          {"Version":"2012-10-17","Statement":[
            {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
            {"Effect":"Allow","Action":["ecr:BatchCheckLayerAvailability","ecr:BatchGetImage","ecr:CompleteLayerUpload",
              "ecr:DescribeImages","ecr:DescribeRepositories","ecr:GetDownloadUrlForLayer","ecr:InitiateLayerUpload",
              "ecr:PutImage","ecr:UploadLayerPart"],
             "Resource":"arn:aws:ecr:$AWS_REGION:$ACCOUNT:repository/$ECR_REPO"},
            {"Effect":"Allow","Action":["ecs:*"],"Resource":"*"},
            {"Effect":"Allow","Action":"iam:PassRole",
             "Resource":["arn:aws:iam::$ACCOUNT:role/$EXEC_ROLE","arn:aws:iam::$ACCOUNT:role/$INFRA_ROLE"]},
            {"Effect":"Allow","Action":["ec2:Describe*","elasticloadbalancing:Describe*","application-autoscaling:Describe*",
              "logs:Describe*","logs:GetLogEvents","logs:FilterLogEvents","cloudwatch:GetMetricData","acm:DescribeCertificate"],
             "Resource":"*"}]}
          JSON
          )
          aws iam put-role-policy --role-name "$DEPLOY_ROLE" --policy-name metronome-deploy --policy-document "$policy"
          echo "deploy role policy written"
      - name: what this account may use (read-only probes, for the summary)
        run: |
          probe() {  # label, command...
            local label=$1; shift
            if out=$("$@" 2>&1); then echo "| $label | allowed |" >> probes.md
            else
              case "$out" in
                *"service control policy"*) echo "| $label | denied by organization policy |" >> probes.md ;;
                *AccessDenied*|*UnauthorizedOperation*) echo "| $label | denied (IAM) |" >> probes.md ;;
                *) echo "| $label | error: $(echo "$out" | tail -1 | cut -c1-80 | sed 's/[0-9]\{12\}/***/g') |" >> probes.md ;;
              esac
            fi
          }
          echo "| probe | result |" > probes.md; echo "|---|---|" >> probes.md
          probe "ecs list-clusters" aws ecs list-clusters
          probe "ec2 describe-vpcs (default VPC)" aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text
          probe "ec2 describe-subnets" aws ec2 describe-subnets --query "Subnets[].SubnetId" --output text
          probe "elbv2 describe-load-balancers" aws elbv2 describe-load-balancers
          probe "application-autoscaling describe" aws application-autoscaling describe-scalable-targets --service-namespace ecs
          probe "acm list-certificates" aws acm list-certificates
          probe "ecr describe-repositories" aws ecr describe-repositories
          probe "lambda list-functions" aws lambda list-functions --max-items 1
          probe "lightsail get-container-services" aws lightsail get-container-services
          probe "apprunner list-services" aws apprunner list-services
          probe "iam list-open-id-connect-providers" aws iam list-open-id-connect-providers
          probe "ec2 describe-instances" aws ec2 describe-instances --max-items 1
          probe "ec2 run-instances --dry-run (t3.small)" bash -c 'out=$(aws ec2 run-instances --dry-run --image-id resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id --instance-type t3.small 2>&1); case "$out" in *DryRunOperation*) exit 0;; *) echo "$out"; exit 1;; esac'
          probe "ec2 describe-addresses (elastic IP)" aws ec2 describe-addresses
          probe "elasticbeanstalk describe-applications" aws elasticbeanstalk describe-applications
          probe "cloudfront list-distributions" aws cloudfront list-distributions --max-items 1
          probe "route53 list-hosted-zones" aws route53 list-hosted-zones --max-items 1
          probe "s3 list-buckets" aws s3api list-buckets
          probe "budgets describe-budgets" aws budgets describe-budgets --account-id "$ACCOUNT" --max-results 1
          cat probes.md
          { echo "### Service probes"; cat probes.md; echo; } >> "$GITHUB_STEP_SUMMARY"
      - name: ECS cluster and log group
        run: |
          if out=$(aws ecs create-cluster --cluster-name "$CLUSTER" --query cluster.status --output text 2>&1); then
            echo "cluster $CLUSTER: $out"; echo "ECS=yes" >> "$GITHUB_ENV"
          else
            echo "$out" | sed 's/[0-9]\{12\}/***/g'
            echo "::warning::ECS is denied in this account (organization policy); see the probe table for what is allowed."
            echo "ECS=no" >> "$GITHUB_ENV"
          fi
          aws logs create-log-group --log-group-name "$LOG_GROUP" 2>/dev/null || true
          aws logs put-retention-policy --log-group-name "$LOG_GROUP" --retention-in-days 14 || true
      - name: ECR repository (optional; the deploy workflow uses the public GHCR image when ECR is denied)
        run: |
          if aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1; then
            echo "ECR repository exists"
          elif out=$(aws ecr create-repository --repository-name "$ECR_REPO" --image-scanning-configuration scanOnPush=true 2>&1); then
            echo "ECR repository created"
          else
            echo "$out" | sed 's/[0-9]\{12\}/***/g'
            echo "::warning::ECR is denied in this account (organization policy). The deploy workflow pulls the public GHCR image instead."
          fi
      - name: summary
        run: |
          {
            echo "### AWS bootstrap done ($AWS_REGION)"
            echo "- OIDC provider, roles \`$DEPLOY_ROLE\`, \`$EXEC_ROLE\`, \`$INFRA_ROLE\`"
            echo "- ECS cluster \`$CLUSTER\`, log group \`$LOG_GROUP\` (ECR only if the account allows it)"
            echo
            if [ "$OIDC" = "yes" ]; then
              echo "Optional, for keyless deploys: add the repository secret \`AWS_ROLE_ARN\` ="
              echo "\`arn:aws:iam::<account id>:role/$DEPLOY_ROLE\` and then delete the access keys."
            else
              echo "OIDC provider not allowed in this account: deployments use the access-key secrets."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

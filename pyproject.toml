[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metronome"
version = "0.1.0"
description = "When should a deployed time-series forecaster be retrained? A non-stop forecasting pipeline with data-driven retraining cadence."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
# Core = what the serving container needs. Training/experiment stacks are extras so the
# inference image never ships PyTorch.
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "onnxruntime>=1.18,<2",
  "pyyaml>=6,<7",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
train = [
  "torch>=2.4,<3",
  "pandas>=2.2,<3",
  "polars>=1.0,<2",
  "pyarrow>=16,<25",
]
export = ["onnx>=1.16,<2", "onnxscript>=0.2,<1"]
mlops = ["mlflow>=2.15,<4", "dvc>=3.50,<4"]
tune = ["optuna>=3.6,<5"]
tf = ["tensorflow>=2.16,<3"]
spark = ["pyspark>=3.5,<5", "pandas>=2.2,<3", "pyarrow>=16,<25"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "types-PyYAML",
  "playwright>=1.45,<2",
]

[project.scripts]
metronome = "metronome.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metronome = ["static/*.html", "static/*.css", "static/*.js", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]  # "." so tests can import tests.conftest under the pytest entrypoint (not only python -m pytest)
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: needs real data or long training"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"  # numpy stubs use the `type` statement; runtime still supports 3.11
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["metronome.data.*", "metronome.drift.*", "metronome.cadence.*", "metronome.serving.*"]
strict = true
